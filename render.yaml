# Render Blueprint for the Python backend (the Next.js frontend goes on Vercel).
# Render dashboard -> New -> Blueprint -> pick this repo. The Python version comes
# from .python-version. See "Deploying" in README.md.
services:
  - type: web
    name: detour-api
    runtime: python
    # free sleeps after 15 min without traffic (the next visit waits about a minute);
    # 0.5c-512mb stays on. The backend uses about 280 MB once loaded and stays under
    # about 380 MB with its caches full, so 512 MB is enough.
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    # One process: the campus graph and the route/shadow caches live in its memory.
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # The Vercel site's address, e.g. https://detour.vercel.app (comma-separate several).
      - key: ALLOWED_ORIGINS
        sync: false
