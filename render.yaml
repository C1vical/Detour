# Render Blueprint for the Python backend (the frontend is on Vercel); see "Deploying" in README.md.
# The Python version comes from .python-version.
services:
  - type: web
    name: detour-api
    runtime: python
    # free sleeps after 15 idle minutes (the next visit waits about a minute); 0.5c-512mb stays on.
    # The backend uses about 280 MB loaded and under 380 MB with full caches.
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    # One process: the campus graph and the route/shadow caches live in its memory.
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # The Vercel site's address, e.g. https://detour.vercel.app (comma-separate several).
      - key: ALLOWED_ORIGINS
        sync: false
