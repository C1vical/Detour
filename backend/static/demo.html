<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContextRoute backend demo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#5b6670; --panel:#f4f6f8; --line:#d5dae0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171a; --fg:#e8ecef; --muted:#9aa5b0; --panel:#1e2327; --line:#333b42; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:16px; margin:0; }
  main { flex:1; display:flex; min-height:0; }
  aside { width:320px; padding:16px; background:var(--panel); overflow:auto; border-right:1px solid var(--line); }
  #map { flex:1; }
  label { display:block; margin:12px 0 4px; font-weight:600; }
  input[type=date], input[type=time] { width:100%; padding:6px; font:inherit; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; }
  input[type=range] { width:100%; }
  .row { display:flex; justify-content:space-between; color:var(--muted); }
  .card { margin-top:14px; padding:10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); }
  .card h2 { font-size:13px; margin:0 0 4px; }
  .red h2 { color:#d1342f; } .green h2 { color:#1f8f3a; }
  .delta { margin-top:14px; font-weight:600; }
  #status { color:var(--muted); margin-top:10px; }
  @media (max-width:700px) { main { flex-direction:column; } aside { width:auto; max-height:45vh; border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<header><h1>ContextRoute: sun-aware routing, York Keele campus</h1></header>
<main>
  <aside>
    <label for="date">Date</label>
    <input type="date" id="date">
    <label for="time">Time of day</label>
    <input type="time" id="time">
    <input type="range" id="slider" min="0" max="1439" step="5" aria-label="Time of day slider">
    <label for="wsun">Sun avoidance: <span id="wsunv"></span></label>
    <input type="range" id="wsun" min="0" max="10" step="0.5" value="3">
    <label for="cloud">Cloud cover: <span id="cloudv"></span></label>
    <input type="range" id="cloud" min="0" max="1" step="0.05" value="0">
    <div id="sun" class="row" style="margin-top:12px"></div>
    <div class="card red"><h2>Fastest route</h2><div id="fast"></div></div>
    <div class="card green"><h2>ContextRoute</h2><div id="ctx"></div></div>
    <div class="delta" id="delta"></div>
    <div id="status"></div>
  </aside>
  <div id="map" role="application" aria-label="Campus map"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const map = L.map("map").setView([43.7735, -79.5019], 15);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap contributors", maxZoom: 19 }).addTo(map);
let shadowLayer, fastLayer, ctxLayer, endpoints = [];

function setTime(mins) {
  const hh = String(Math.floor(mins / 60)).padStart(2, "0"), mm = String(mins % 60).padStart(2, "0");
  $("time").value = hh + ":" + mm;
  $("slider").value = mins;
}
// Defaults: a summer afternoon.
$("date").value = "2026-06-21";
setTime(14 * 60);

const fmt = s => Math.floor(s / 60) + " min " + String(Math.round(s % 60)).padStart(2, "0") + " sec";
const signed = (n, d) => (n >= 0 ? "+" : "") + n.toFixed(d);

let timer, seq = 0;
function schedule() { clearTimeout(timer); timer = setTimeout(refresh, 150); }

async function refresh() {
  const mine = ++seq;
  const q = new URLSearchParams({ date: $("date").value, time: $("time").value,
    w_sun: $("wsun").value, cloud_cover: $("cloud").value });
  $("wsunv").textContent = $("wsun").value;
  $("cloudv").textContent = $("cloud").value;
  $("status").textContent = "Loading...";
  try {
    const [r, s] = await Promise.all([
      fetch("/route?" + q).then(x => x.ok ? x.json() : Promise.reject("HTTP " + x.status)),
      fetch("/shadows?" + new URLSearchParams({ date: q.get("date"), time: q.get("time") })).then(x => x.json()),
    ]);
    if (mine !== seq) return;  // a newer request superseded this one
    [shadowLayer, fastLayer, ctxLayer].concat(endpoints).forEach(l => l && map.removeLayer(l));
    shadowLayer = L.geoJSON(s, { style: { color: "#222", weight: 0, fillOpacity: 0.35 } }).addTo(map);
    fastLayer = L.geoJSON(r.fastest.geometry, { style: { color: "#d1342f", weight: 5, opacity: 0.85 } }).addTo(map);
    ctxLayer = L.geoJSON(r.contextroute.geometry, { style: { color: "#1f8f3a", weight: 5, opacity: 0.9 } }).addTo(map);
    endpoints = [L.marker(r.origin).addTo(map).bindTooltip("Start"),
                 L.marker(r.destination).addTo(map).bindTooltip("End")];
    const f = r.fastest, c = r.contextroute;
    $("fast").textContent = fmt(f.seconds) + " · " + Math.round(f.distance_m) + " m · " + f.sun_percent.toFixed(0) + "% sun";
    $("ctx").textContent = fmt(c.seconds) + " · " + Math.round(c.distance_m) + " m · " + c.sun_percent.toFixed(0) + "% sun";
    $("delta").textContent = signed(r.extra_seconds, 0) + " sec, " + signed(r.sun_percent_change, 0) + " pts sun exposure";
    $("sun").innerHTML = r.sun.is_daylight
      ? "<span>Sun elevation " + r.sun.elevation_deg.toFixed(0) + "°</span><span>azimuth " + r.sun.azimuth_deg.toFixed(0) + "°</span>"
      : "<span>Sun is below the horizon</span>";
    $("status").textContent = "";
  } catch (e) {
    $("status").textContent = "Request failed: " + e;
  }
}

$("date").addEventListener("input", schedule);
$("time").addEventListener("input", () => {
  const [h, m] = $("time").value.split(":").map(Number);
  if (!isNaN(h)) { $("slider").value = h * 60 + m; schedule(); }
});
$("slider").addEventListener("input", () => { setTime(+$("slider").value); schedule(); });
$("wsun").addEventListener("input", schedule);
$("cloud").addEventListener("input", schedule);
refresh();
</script>
</body>
</html>
